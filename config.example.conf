# OpenClaw Backup Toolkit 配置文件示例
# 复制此文件到 ~/.openclaw-backup.conf 并修改

# ============================================
# OpenClaw 安装路径配置
# ============================================

# OpenClaw 配置目录（包含 openclaw.json）
# 默认: $HOME/.openclaw
OPENCLAW_CONFIG="$HOME/.openclaw"

# OpenClaw Workspace 目录（包含 SOUL.md 等）
# 默认: $HOME/clawd
OPENCLAW_WORKSPACE="$HOME/clawd"

# OpenClaw CLI 路径
# 默认: openclaw（从 PATH 查找）
OPENCLAW_CLI="openclaw"

# ============================================
# 备份配置
# ============================================

# 备份存储目录
# 默认: ${OPENCLAW_WORKSPACE}/backups
BACKUP_DIR="$HOME/clawd/backups"

# 备份保留天数（超过将自动清理）
# 默认: 7
BACKUP_RETENTION_DAYS=7

# 定时备份间隔（小时）
# 默认: 4
SCHEDULE_INTERVAL_HOURS=4

# 时区
# 默认: Asia/Shanghai
TIMEZONE="Asia/Shanghai"

# ============================================
# 高级配置（可选）
# ============================================

# 备份排除模式（空格分隔）
# BACKUP_EXCLUDES="node_modules .git backups *.log"

# 是否压缩备份（tar.gz）
# 默认: true
# BACKUP_COMPRESS=true

# 备份完成后是否通知
# 默认: false
# BACKUP_NOTIFY=false
